[package]
name = "leeloo"
version = "0.1.0"
edition = "2024"
description = "Terminal local, sessions SSH et connexion aux VM Azure via Entra ID"
license = "MIT"
license-file = "LICENSE"
publish = false

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
vte4 = { version = "0.10.0", features = ["v0_76"] }

[profile.release]
strip = true
lto = "thin"

[package.metadata.deb]
maintainer = "Schoomee <25286448+Schoomee@users.noreply.github.com>"
section = "net"
priority = "optional"
extended-description = """\
Client de terminal pour Ubuntu : terminal local, gestion de sessions SSH \
(dossiers, couleurs, import de ~/.ssh/config) et sélecteur de VM Azure \
avec connexion Entra ID via `az ssh vm`."""
depends = "$auto, openssh-client"
suggests = "azure-cli"
assets = [
  ["target/release/leeloo", "usr/bin/", "755"],
  ["assets/io.github.Schoomee.Leeloo.desktop", "usr/share/applications/", "644"],
  ["assets/io.github.Schoomee.Leeloo.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]
